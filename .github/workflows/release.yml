name: Release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nateadmin"
      - run: npm ci
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: npm run release
          title: "Release @nateadmin/ui"
          commit: "Release @nateadmin/ui"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Apps without a registry token install the package file from the public GitHub Release:
      # https://github.com/nateadmin/ui/releases/download/v<version>/nateadmin-ui-<version>.tgz
      - name: Attach the package file to the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          npm pack
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "See CHANGELOG.md"
          gh release upload "$tag" "nateadmin-ui-${version}.tgz" --clobber
